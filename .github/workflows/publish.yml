name: Publish deck
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The deck is the Lectern file index.html and what it references; no build step.
      - run: |
          mkdir -p _pub
          cp -R index.html theme.css reveal fonts fig images media _pub/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pub
      - id: deployment
        uses: actions/deploy-pages@v4
